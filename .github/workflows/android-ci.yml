name: Android CI

# Every push (fast feedback) and every PR targeting the protected branches
# — mirrors the web repo's backend-ci.yml/frontend-ci.yml trigger shape
# for consistency across both repos.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, release, master]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No google-services.json here on purpose (never committed — see
      # .gitignore and CLAUDE.md's Firebase section). app/build.gradle.kts
      # only applies the google-services/firebase-crashlytics plugins when
      # that file exists, so CI builds the same way any fresh clone does:
      # Firebase present on the classpath but inert. This is the actual
      # default developer experience, not a workaround for it.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
